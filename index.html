<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Oshnik Maurya | Research Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg:#0f172a; --card:#111827; --text:#e5e7eb; --accent:#3b82f6;
}
body{margin:0;font-family:Inter;background:var(--bg);color:var(--text)}
header{padding:60px;text-align:center;background:linear-gradient(135deg,#1e3a8a,#2563eb)}
header img{width:120px;border-radius:50%}
section{max-width:1100px;margin:30px auto;padding:25px;background:var(--card);border-radius:12px}
h2{border-bottom:2px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{padding:20px;background:#1f2937;border-radius:10px}
button{padding:8px 15px;margin:5px;border:none;border-radius:20px;background:var(--accent);color:white;cursor:pointer}
input{padding:10px;width:100%;margin:10px 0;border-radius:8px;border:none}
a{color:#60a5fa}
</style>
</head>
<body>

<header>
<img src="profile.jpg">
<h1>Dr. Oshnik Maurya</h1>
<p id="stats">📊 Loading metrics...</p>
</header>

<section>
<h2>📈 Citation Trend</h2>
<canvas id="chart"></canvas>
</section>

<section>
<h2>📚 Publications</h2>
<input type="text" id="search" placeholder="Search publications..." onkeyup="filterPubs()">
<div id="pubs">
<div class="card">Ni-Based Chalcogenides – Small (2021)</div>
<div class="card">TiO2 Nanotubes – Electrochimica Acta (2023)</div>
<div class="card">NiSe Composite – ACS AMI (2024)</div>
</div>
</section>

<section>
<h2>⚡ Research Dashboard</h2>
<div class="grid">
<div class="card"><h3>Publications</h3><p>15+</p></div>
<div class="card"><h3>Citations</h3><p id="cit">...</p></div>
<div class="card"><h3>h-index</h3><p id="h">...</p></div>
</div>
</section>

<section>
<h2>🔗 Links</h2>
<p><a href="https://scholar.google.com/citations?user=iulsZcYAAAAJ" target="_blank">Google Scholar</a></p>
</section>

<script>
async function loadScholar(){
 try{
  const url="https://api.allorigins.win/raw?url="+encodeURIComponent("https://scholar.google.com/citations?user=iulsZcYAAAAJ&hl=en");
  const res=await fetch(url);
  const text=await res.text();

  const cit=text.match(/Citations<\\/td><td class=\"gsc_rsb_std\">(\\d+)/);
  const h=text.match(/h-index<\\/td><td class=\"gsc_rsb_std\">(\\d+)/);

  document.getElementById("stats").innerText=`📊 ${cit?cit[1]:"-"}+ Citations | h-index ${h?h[1]:"-"}`;
  document.getElementById("cit").innerText=cit?cit[1]:"-";
  document.getElementById("h").innerText=h?h[1]:"-";
 }catch(e){document.getElementById("stats").innerText="Error loading stats"}
}
loadScholar();

// Chart (fixed)
window.onload = function() {
  const ctx = document.getElementById('chart');
  if (!ctx) return;

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['2021','2022','2023','2024','2025'],
      datasets: [{
        label: 'Citations',
        data: [10,40,90,180,258],
        fill: false,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
};

// Filter
function filterPubs(){
 let input=document.getElementById('search').value.toLowerCase();
 let cards=document.querySelectorAll('#pubs .card');
 cards.forEach(c=>{
  c.style.display=c.innerText.toLowerCase().includes(input)?'block':'none';
 });
}
</script>

</body>
</html>
